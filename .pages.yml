media:
  input: public/images
  output: /images

content:
  - name: writing
    label: Writing
    description: Every entry in your Writing log. Add a link to point to a piece published elsewhere, or leave it empty and write the post here.
    type: collection
    path: src/content/writing
    filename: "{primary}.md"
    view:
      fields: [title, date, publication, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: One-line summary
        description: Shown under the title in the Writing log.
        type: text
      - name: link
        label: External link
        description: For pieces published somewhere else, paste the full URL. Leave empty to publish the post on your own site.
        type: string
      - name: publication
        label: Published in
        description: Where the piece ran, e.g. Contrary Research. Only shown when there's an external link.
        type: string
      - name: draft
        label: Draft
        description: Tick to hide this entry from the live site.
        type: boolean
        default: false
      - name: body
        label: Post
        description: Leave empty for pieces published elsewhere.
        type: rich-text

  - name: books
    label: Books
    description: Add a title and author and the cover is found for you automatically when the site updates.
    type: collection
    path: src/content/books
    filename: "{primary}.md"
    view:
      fields: [title, author, status]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        required: true
      - name: status
        label: Status
        type: select
        default: Reading
        options:
          values: [Reading, Read]
      - name: quote
        label: Quote
        description: Shown in large type next to the cover. Optional.
        type: text
      - name: date
        label: Date
        description: Books are listed newest first. Filled in for you.
        type: date
      - name: isbn
        label: ISBN (optional)
        description: Only needed if the automatic cover is the wrong edition. Find the ISBN on the book's back cover or its page on a bookstore site.
        type: string
      - name: cover
        label: Cover image (optional)
        description: Upload a cover to replace the automatic one.
        type: image

  - name: about
    label: About me
    type: file
    path: src/data/about.md
    fields:
      - name: title
        label: Page title
        description: Shown in the browser tab.
        type: string
      - name: headline
        label: Big headline
        description: The large text at the top of the page. Leave empty to show the page title.
        type: string
      - name: body
        label: About text
        description: Shown under the headline.
        type: rich-text

  - name: settings
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Your name
        type: string
        required: true
      - name: writingIntro
        label: Writing note
        description: The note beside the Writing headline.
        type: text
      - name: email
        label: Email
        type: string
      - name: linkedin
        label: LinkedIn URL
        description: Leave empty to hide.
        type: string
      - name: x
        label: X URL
        description: Leave empty to hide.
        type: string
      - name: disclaimer
        label: Footer note
        type: string
