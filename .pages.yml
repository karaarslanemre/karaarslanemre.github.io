media:
  input: public/images
  output: /images

content:
  - name: writing
    label: Writing
    description: Every entry in your Writing log. Add a link to point to a piece published elsewhere, or leave it empty and write the post here.
    type: collection
    path: src/content/writing
    filename: "{primary}.md"
    view:
      fields: [title, date, publication, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: One-line summary
        description: Shown under the title in the Writing log.
        type: text
      - name: link
        label: External link
        description: For pieces published somewhere else, paste the full URL. Leave empty to publish the post on your own site.
        type: string
      - name: publication
        label: Published in
        description: Where the piece ran, e.g. Contrary Research. Only shown when there's an external link.
        type: string
      - name: draft
        label: Draft
        description: Tick to hide this entry from the live site.
        type: boolean
        default: false
      - name: body
        label: Post
        description: Leave empty for pieces published elsewhere.
        type: rich-text

  - name: books
    label: Books
    description: Add a title and author and the cover is found for you automatically when the site updates.
    type: collection
    path: src/content/books
    filename: "{primary}.md"
    view:
      fields: [title, author, status]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        required: true
      - name: status
        label: Status
        type: select
        default: Reading
        options:
          values: [Reading, Read]
      - name: quote
        label: Quote
        description: Shown in large type next to the cover. Optional.
        type: text
      - name: date
        label: Date
        description: Books are listed newest first. Filled in for you.
        type: date
      - name: isbn
        label: ISBN (optional)
        description: Only needed if the automatic cover is the wrong edition. Find the ISBN on the book's back cover or its page on a bookstore site.
        type: string
      - name: cover
        label: Cover image (optional)
        description: Upload a cover to replace the automatic one.
        type: image

  - name: projects
    label: Projects
    description: Tiles on the Projects page. Each tile links to the project's own page (like /projects/strata/) or to a site elsewhere.
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: One-line summary
        description: Shown under the title on the tile.
        type: text
      - name: link
        label: Link
        description: A page on this site, like /projects/strata/, or a full web address for a project hosted elsewhere.
        type: string
        required: true
      - name: label
        label: Side label
        description: The small text running up the tile's right edge, e.g. "Tool · Try it". Leave empty to show "Project".
        type: string
      - name: draft
        label: Draft
        description: Tick to hide this project from the live site.
        type: boolean
        default: false

  - name: about
    label: About me
    type: file
    path: src/data/about.md
    fields:
      - name: title
        label: Page title
        description: Shown in the browser tab.
        type: string
      - name: headline
        label: Big headline
        description: The large text at the top of the page. Leave empty to show the page title.
        type: string
      - name: body
        label: About text
        description: Shown under the headline.
        type: rich-text

  - name: settings
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Your name
        type: string
        required: true
      - name: writingIntro
        label: Writing note
        description: The note beside the Writing headline.
        type: text
      - name: email
        label: Email
        type: string
      - name: linkedin
        label: LinkedIn URL
        description: Leave empty to hide.
        type: string
      - name: x
        label: X URL
        description: Leave empty to hide.
        type: string
      - name: disclaimer
        label: Footer note
        type: string

  - name: strata
    label: Strata settings
    description: Settings for the Strata project. You only need these once, when connecting its free AI server.
    type: file
    path: src/data/strata.json
    format: json
    fields:
      - name: server
        label: Free server address
        description: The address shown when the "Deploy Strata server" run on GitHub finishes, like https://strata.yourname.workers.dev. Leave empty to turn free explanations off; visitors can still try the example or use their own key.
        type: string
      - name: modelLabel
        label: Model name shown to visitors
        description: Only change this if you change MODEL in worker/wrangler.jsonc.
        type: string
      - name: claude
        label: Open in Claude link
        description: The claude.ai link to the copy of Strata that runs on each visitor's own Claude plan. Leave empty to hide the "Open in Claude" links.
        type: string
